name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected."
            exit 1
          fi

          java -version

          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          JAVA_RAW_VER="$(printf '%s\n' "$JAVA_VER_LINE" | sed -E 's/.*version "([^"]+)".*/\1/')"
          if [ -z "$JAVA_RAW_VER" ] || [ "$JAVA_RAW_VER" = "$JAVA_VER_LINE" ]; then
            echo "::error::Unable to detect active Java version from output: $JAVA_VER_LINE"
            exit 1
          fi

          if printf '%s' "$JAVA_RAW_VER" | grep -q '^1\.'; then
            JAVA_MAJOR="$(printf '%s' "$JAVA_RAW_VER" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$JAVA_RAW_VER" | cut -d. -f1)"
          fi

          if ! printf '%s' "$JAVA_MAJOR" | grep -Eq '^[0-9]+$'; then
            echo "::error::Unable to parse active Java major version from: $JAVA_RAW_VER"
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+${JAVA_HOME}/bin/}keytool"
          if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
            KEYTOOL_BIN="keytool"
          fi
          if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
            echo "::error::keytool from the configured Java installation was not found."
            exit 1
          fi

          if [ ! -f ./debug.keystore ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Temporary debug keystore ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/vistagram-release.XXXXXX")"
          DEST_APK="${TEMP_DIR}/app-debug.apk"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Prepared release APK missing or empty at $DEST_APK"
            exit 1
          fi

          echo "apk_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $(basename "$DEST_APK")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_asset.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "${PREPARED_APK:-}" ] || [ ! -f "$PREPARED_APK" ]; then
            echo "::error::Prepared APK does not exist."
            exit 1
          fi
          if [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared APK is empty."
            exit 1
          fi
          case "$PREPARED_APK" in
            *.apk) ;;
            *)
              echo "::error::Prepared asset does not end in .apk."
              exit 1
              ;;
          esac
          if [ "$(basename "$PREPARED_APK")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- Purpose: This APK is intended for testing only and is not a Google Play Store production release." \
            "- Signing: Signed only with a temporary debug keystore generated on the runner.")"

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "Release page URL: $RELEASE_URL"
            echo "APK filename: app-debug.apk"
            echo "Backup Actions artifact: app-debug-apk"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_APK_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** $RELEASE_URL"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup:** The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Publishing APK to GitHub Releases failed."
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "Backup GitHub Actions artifact app-debug-apk remains available."
            fi

            {
              echo "## GitHub Release Publishing Failed"
              echo ""
              if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                echo "- The debug APK build succeeded."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- The GitHub Actions backup artifact \`app-debug-apk\` remains available."
              fi
              echo "- The new APK is not available via the direct latest-release link because release publishing failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
